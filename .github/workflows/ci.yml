name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  license-and-backend:
    name: Backend Tests, Golden Benchmarks & License Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies for Swiss Ephemeris
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run License & Attribution Check
        run: |
          python backend/scripts/license_check.py

      - name: Run Pytest Suite (32 Golden Charts, Kootas, Cancellations, Security, API)
        run: |
          PYTHONPATH=backend pytest backend/tests/ -v

  frontend:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint & Type-check
        working-directory: ./frontend
        run: npm run lint

      - name: Production Build
        working-directory: ./frontend
        run: npm run build
