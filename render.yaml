# Render Blueprint — deploys the FastAPI backend as a free web service.
# Deploy: Render dashboard -> New + -> Blueprint -> select this repository.
# Render reads this file and creates the service automatically.
#
# Free tier notes:
# - The service sleeps after ~15 minutes without traffic; the first request
#   after a sleep takes ~30-60 s to wake (cold start).
# - No database is needed: the API is a stateless calculation service using
#   the Swiss Ephemeris library's built-in ephemeris.
services:
  - type: web
    name: kundalireport-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
